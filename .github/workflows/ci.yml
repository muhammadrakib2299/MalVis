name: CI

# Runs on every push to main and on every PR. We deliberately do not
# split by path filters: the project is small enough that running both
# jobs everywhere is cheaper than the cognitive cost of "did the right
# job run?" debugging when a status check is missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same ref — pushing a fix while a check is
# still running shouldn't burn a full second runner-minute on the
# obsoleted commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Tooling not in requirements.txt — kept out of the runtime image.
          pip install ruff==0.7.4 black==24.10.0

      # Ruff, black, and pytest all read config from the repo-root
      # pyproject.toml, so they run from the workspace root.
      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest
        run: pytest -ra
        env:
          # Force in-process extractor in CI — the subprocess path forks
          # a worker per test and would slow the suite without changing
          # what's covered.
          EXTRACTOR_STRATEGY: inprocess

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # `cache: npm` requires a lockfile to key on. We omit `cache:`
          # entirely so CI passes before the lockfile lands; once the
          # frontend lockfile is committed, add `cache: npm` here and
          # the install step's branch becomes dead code.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json missing — falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          # The bundle bakes NEXT_PUBLIC_API_BASE at build time. CI uses
          # a placeholder; production sets the real value via build args
          # (see docker-compose.yml).
          NEXT_PUBLIC_API_BASE: /api

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 grabs the full history so Trufflehog can diff a
      # range, not just the tip. The bandwidth cost is negligible for a
      # repo this size; the alternative (shallow clone) would force
      # Trufflehog into "scan everything every run" mode, which on a
      # large repo would either spam findings or get rate-limited.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Trufflehog runs first: a leaked credential is the most urgent
      # finding the security job can produce, and we want CI to scream
      # about it before spending minutes on slower scanners.
      #
      # `--only-verified` means a finding only fails CI when Trufflehog
      # can actively confirm the credential works (e.g. by hitting the
      # provider's identity endpoint). Unverified hits show up in the
      # log so a maintainer can audit them, but they don't gate the
      # build — without verification the false-positive rate is high
      # enough to train people to ignore the job.
      - name: Trufflehog secrets scan
        uses: trufflesecurity/trufflehog@v3.83.6
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail

      # Trivy filesystem scan — picks up known CVEs from
      # backend/requirements.txt, frontend/package.json (and lockfile
      # when present), the base images referenced in our Dockerfiles,
      # and any committed secrets via the misconfig/secret detectors.
      #
      # We fail on HIGH and CRITICAL: anything below is noise for a
      # young project (every Python image has informational findings
      # that take weeks to drain from upstream). When we tighten
      # thresholds later, change `severity` here, not in suppressions.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # Skip the .next/ build cache and node_modules — they don't
          # exist in CI but the rule is here so a cached artifact never
          # accidentally inflates the scan surface.
          skip-dirs: frontend/node_modules,frontend/.next

      # Semgrep auto config picks Python + TypeScript security rules
      # from the public registry. Fails when any ERROR-severity finding
      # appears; WARNING and INFO are reported but don't fail the job.
      - name: Set up Python (Semgrep host)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep==1.91.0

      - name: Semgrep (auto config)
        run: semgrep --config auto --error --metrics off --severity ERROR .
